<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Reviews - AI Code Review Assistant</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="nav-brand">
                <i class="fas fa-code-branch"></i>
                <span>AI Code Review</span>
            </a>
            <div class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></div>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link" data-nav="home">Home</a>
                <a href="dashboard.html" class="nav-link" data-nav="dashboard">Dashboard</a>
                <a href="review.html" class="nav-link" data-nav="review">New Review</a>
                <a href="reviews.html" class="nav-link" data-nav="reviews">Reviews</a>
                <a href="profile.html" class="nav-link" data-nav="profile">Profile</a>
                <a href="#" class="nav-link" id="logoutLink">Logout</a>
            </div>
        </div>
    </nav>

    <section class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <div>
                    <h1><i class="fas fa-history"></i> Review History</h1>
                    <p>All your past code reviews</p>
                </div>
                <button type="button" class="btn btn-primary" id="newReviewBtn">
                    <i class="fas fa-plus"></i> New Review
                </button>
            </div>

            <div class="dashboard-section">
                <div id="reviewsContainer"></div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>No reviews yet. Create your first code review!</p>
                    <a href="review.html" class="btn btn-primary">Analyze Code</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AI Code Review Assistant. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/reviews.js"></script>
</body>
</html>
