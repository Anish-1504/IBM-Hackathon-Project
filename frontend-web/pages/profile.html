<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AI Code Review Assistant</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="nav-brand">
                <i class="fas fa-code-branch"></i>
                <span>AI Code Review</span>
            </a>
            <div class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></div>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link" data-nav="home">Home</a>
                <a href="dashboard.html" class="nav-link" data-nav="dashboard">Dashboard</a>
                <a href="review.html" class="nav-link" data-nav="review">New Review</a>
                <a href="reviews.html" class="nav-link" data-nav="reviews">Reviews</a>
                <a href="profile.html" class="nav-link" data-nav="profile">Profile</a>
                <a href="#" class="nav-link" id="logoutLink">Logout</a>
            </div>
        </div>
    </nav>

    <section class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <div>
                    <h1><i class="fas fa-user-cog"></i> Account Settings</h1>
                    <p>Manage your profile and preferences</p>
                </div>
            </div>

            <div class="dashboard-section auth-card" style="max-width: 600px;">
                <form id="profileForm" class="auth-form">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="username"><i class="fas fa-at"></i> Username</label>
                        <input type="text" id="username" disabled>
                    </div>
                    <div class="form-group">
                        <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="fullName" placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label for="githubToken"><i class="fab fa-github"></i> GitHub Token (optional)</label>
                        <input type="password" id="githubToken" placeholder="For GitHub integration">
                        <small class="form-hint">Used to fetch pull requests from your repositories</small>
                    </div>
                    <p class="text-muted"><i class="fas fa-calendar"></i> Member since: <span id="memberSince">-</span></p>

                    <div id="profileError" class="error-message" style="display: none;"></div>
                    <div id="profileSuccess" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-block" id="saveProfileBtn">
                        <span class="btn-text">Save Changes</span>
                        <span class="btn-loader" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AI Code Review Assistant. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
